[mypy]
python_version = 3.12
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
files = app

# --- Focus: catch await on non-awaitable functions ---
# This is the pattern that masked pool_manager.update_market_regime
# being silently dead code for the entire project lifecycle.
warn_return_any = false
disallow_any_unimported = false

# --- Allow common 3rd-party stubs to be missing ---
ignore_missing_imports = true

# --- Per-module exceptions (known legacy issues) ---
; None at this point - we want to surface all issues

[mypy-app.fetchers.*]
ignore_errors = true

[mypy-app.routers.*]
ignore_errors = true

[mypy-app.monitor.*]
ignore_errors = true

[mypy-app.services.portfolio_service]
ignore_errors = true

# Split package (Batch 1) carries the same legacy code as the exempted
# portfolio_service module - exemption follows the code, not the file.
[mypy-app.services.portfolio.*]
ignore_errors = true

[mypy-app.services.market_service]
ignore_errors = true

[mypy-app.tasks.design_report]
ignore_errors = true

[mypy-app.tasks.task_manager]
ignore_errors = true
