  dependencies: ["profit_yoy"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.growth.revenue_qoq"
  name: "营收环比增速"
  category: "style"
  subcategory: "growth"
  frequency: "monthly"
  standardization: "industry_neutral"
  lookback_window: 1
  description: "营收环比增长率，捕捉拐点"
  tags: ["growth", "revenue", "qoq"]
  dependencies: ["revenue_qoq"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.growth.profit_qoq"
  name: "净利环比增速"
  category: "style"
  subcategory: "growth"
  frequency: "monthly"
  standardization: "industry_neutral"
  lookback_window: 1
  description: "净利润环比增长率，捕捉盈利拐点"
