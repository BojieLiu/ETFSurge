# --- Volatility 波动 (5个) ---
- code: "style.volatility.ivol_20d"
  name: "20日特异波动"
  category: "style"
  subcategory: "volatility"
  frequency: "daily"
  standardization: "zscore"
  lookback_window: 20
  description: "市场模型残差标准差*sqrt(252)，特异风险"
  tags: ["volatility", "idiovol", "risk"]
  dependencies: ["close", "market_index"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.volatility.ivol_60d"
  name: "60日特异波动"
