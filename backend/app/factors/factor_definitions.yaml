  ic_ir_threshold: 0.5

- code: "style.momentum.mom_3m"
  name: "3月动量"
  category: "style"
  subcategory: "momentum"
  frequency: "daily"
  standardization: "zscore"
  lookback_window: 63
  description: "过去63个交易日收益率，中短期动量"
  tags: ["momentum", "medium_term"]
  dependencies: ["close"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.momentum.mom_6m"
  name: "6月动量"
  category: "style"
  subcategory: "momentum"
  frequency: "daily"
  standardization: "zscore"
  lookback_window: 126
  description: "过去126个交易日收益率，中期动量"
