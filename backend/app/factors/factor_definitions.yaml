  tags: ["growth", "roe", "cagr", "quality"]
  dependencies: ["roe_3y_cagr"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

# --- Quality 质量 (6个) ---
- code: "style.quality.roe_ttm"
  name: "ROE TTM"
  category: "style"
  subcategory: "quality"
