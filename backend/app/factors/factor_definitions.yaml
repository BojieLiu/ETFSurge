# =============================================================================
# 因子标准化定义配置文件
# 版本: v1.0
# 更新日期: 2025-01-17
# 因子总数: 128
# 兼容: 华证标准化因子 / 中证因子系列 / 申万因子体系 / MSCI Barra China
# =============================================================================

factor_definitions:

# =============================================================================
# STYLE 风格因子 (21个) - 对标华证7大类
# =============================================================================
# --- Size 规模 (3个) ---
- code: "style.size.ln_mcap"
  name: "对数市值"
  category: "style"
  subcategory: "size"
  frequency: "daily"
  standardization: "zscore"
  lookback_window: 1
  description: "自然对数(总市值)，规模因子核心代理"
  tags: ["size", "baseline"]
  dependencies: ["total_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.size.ln_float_mcap"
  name: "对数流通市值"
  category: "style"
  subcategory: "size"
  frequency: "daily"
  standardization: "zscore"
  lookback_window: 1
  description: "自然对数(流通市值)，剔除限售股影响"
  tags: ["size", "free_float"]
  dependencies: ["float_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.size.total_mv_rank"
  name: "总市值排名"
  category: "style"
  subcategory: "size"
  frequency: "daily"
  standardization: "rank"
  lookback_window: 1
  description: "全市场总市值百分位排名"
  tags: ["size", "rank"]
  dependencies: ["total_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

# --- Value 价值 (6个) ---
- code: "style.value.ep_ttm"
  name: "盈利收益率(E/P)"
  category: "style"
  subcategory: "value"
  frequency: "monthly"
  standardization: "industry_neutral"
  lookback_window: 1
  description: "滚动TTM净利润/总市值，价值因子核心指标"
  tags: ["value", "earnings_yield"]
  dependencies: ["net_profit_ttm", "total_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.value.bp"
  name: "市净率倒数(B/P)"
  category: "style"
  subcategory: "value"
  frequency: "monthly"
  standardization: "industry_neutral"
  lookback_window: 1
  description: "净资产/总市值，传统价值因子"
  tags: ["value", "book_to_price"]
  dependencies: ["net_asset", "total_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.value.sp"
  name: "市销率倒数(S/P)"
  category: "style"
  subcategory: "value"
  frequency: "monthly"
  standardization: "industry_neutral"
  lookback_window: 1
  description: "销售收入/总市值，适用于亏损企业估值"
  tags: ["value", "sales_to_price"]
  dependencies: ["revenue_ttm", "total_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.value.dply"
  name: "股息率"
  category: "style"
  subcategory: "value"
  frequency: "monthly"
  standardization: "industry_neutral"
  lookback_window: 1
  description: "现金分红/总市值，红利因子核心"
  tags: ["value", "dividend", "income"]
  dependencies: ["dividend_ttm", "total_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.value.ep_lyr"
  name: "去年盈利收益率"
  category: "style"
  subcategory: "value"
  frequency: "monthly"
  standardization: "industry_neutral"
  lookback_window: 1
  description: "上一年度净利润/总市值，剔除TTM滞后性"
  tags: ["value", "earnings_yield", "lyr"]
  dependencies: ["net_profit_lyr", "total_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

- code: "style.value.dividend_yield"
  name: "股息率"
  category: "style"
  subcategory: "value"
  frequency: "monthly"
  standardization: "industry_neutral"
  lookback_window: 1
  description: "最近12月现金分红/总市值，红利因子核心"
  tags: ["value", "dividend", "income"]
  dependencies: ["dividend_ttm", "total_mv"]
  ic_threshold: 0.02
  ic_ir_threshold: 0.5

# --- Growth 成长 (5个) ---
