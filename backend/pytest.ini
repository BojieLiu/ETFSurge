[pytest]
testpaths = tests
# slow（真实网络集成）默认排除——与 markers 注释声明一致（原 addopts 漏加 not slow，
# 导致 pre-commit pytest -x 撞上需要真实数据管道的 slow 用例）
# F23 (round6 §17.2): 全局 --timeout 兜底 —— 挂起测试被 pytest-timeout 线程模式
# 杀死并报 FAIL，而非无限挂起（commit 曾卡死 ~1 小时）。thread 模式可输出当前
# 测试名便于定位。
# round35 §16-T-P0-1 (docs/round35-architecture-review.md): network 用例默认排除——
# 6 个 @pytest.mark.network 真网络测试此前随全量运行打真实 Sina/Caixin 接口，
# 违反 AGENTS.md「外部网络必须 mock」且为套件环境性 flaky 源；需真网络时 -m network 显式跑。
addopts = -m "not integration and not slow and not network and not agentic" --timeout=180 --timeout-method=thread
asyncio_mode = auto
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: requires live data sources (not isolated)
    slow: marks tests as slow (deselect by default with '-m "not slow"')
    network: allows real network access (bypasses the socket guard in backend/conftest.py)
    agentic: LangGraph comparison implementation (v7 P1.5); run with '-m agentic' (isolated from main test suite)
