# ETF Surge — 单文件双模式编排
#
# 开发态 (源码挂载 + 热更新):
#   docker-compose up --build --profile dev
#     后端: uvicorn --reload  (源码 ./backend 挂载, 改 Python 即生效)
#     前端: vite dev server   (源码 ./frontend 挂载, 改 Vue 即生效, 暴露 5173)
#     访问: http://localhost:5173
#
# 生产态 (镜像烘焙 + nginx):
#   docker-compose up --build --profile prod
#     backend + redis + nginx(前端构建产物) 打包, 暴露 80
#     访问: http://localhost
#
# 默认不带 profile 只会启动 redis, 请务必指定 --profile。

services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ---------- 生产态 ----------
  backend:
    build:
      context: ./backend
    profiles: ["prod"]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # 覆盖 .env 的 LOG_LEVEL=DEBUG：生产日志级别收窄为 INFO（与 dev 对齐，省预热期 DEBUG 日志开销；
      # 排障需 DEBUG 时用 `docker compose run -e LOG_LEVEL=DEBUG` 临时覆盖）
      - LOG_LEVEL=INFO
      # round9 P3-6: PROFILE_WARMUP 诊断开关回滚——本轮诊断注入的 profiler 残留已移除
      # （常态运行无 profiler 开销；需要诊断时 `docker compose run -e PROFILE_WARMUP=1` 临时注入）
      # 覆盖 .env 中的 Windows 绝对路径（DATABASE_URL=sqlite+aiosqlite:///E:/...），
      # 适配容器内路径，否则 prod 容器会落到空数据库（instruments=0、持仓/自选全空）
      - DATABASE_URL=sqlite+aiosqlite:////app/data/portfolio.db
    volumes:
      - ./data:/app/data
      # round9 P2-7: logs 挂载宿主可见——预热报告/诊断产物直接落宿主，免 docker cp
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    profiles: ["prod"]
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ---------- 开发态 (热更新) ----------
  backend-dev:
    build:
      context: ./backend
    profiles: ["dev"]
    # O21 (round8): 本地 `::` 双栈；容器内 Linux 下 `::` 拒 IPv4（uvicorn 设 V6ONLY），
    # Docker 端口映射走 IPv4 → 容器内必须 0.0.0.0（list 形式避免 go-yaml 对 `::` 的解析歧义）
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PROFILE_WARMUP=1
      # U7/N08 R4: DEBUG → INFO（预热期 DEBUG 日志开销 ~1.9s；预热计时由 PROFILE_WARMUP 保留）
      - LOG_LEVEL=INFO
      # 覆盖 .env 中的 Windows 绝对路径，适配容器内路径
      - DATABASE_URL=sqlite+aiosqlite:////app/data/portfolio.db
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - redis

  frontend-dev:
    build:
      context: ./frontend
      target: dev
    profiles: ["dev"]
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      # dev 模式下 Vite 代理指向容器内的 backend-dev, 而非 localhost
      - VITE_PROXY_TARGET=http://backend-dev:8000
      - VITE_WS_TARGET=ws://backend-dev:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules   # 保留镜像内已安装的依赖, 不被挂载覆盖
    depends_on:
      - backend-dev

