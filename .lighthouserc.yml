# Lighthouse CI Configuration
# Run: lhci autorun
# Requires: @lhci/cli installed globally or in devDependencies

ci:
  collect:
    numberOfRuns: 3
    startServerCommand: "npx serve dist -s -l 5173"
    url:
      - http://localhost:5173/
      - http://localhost:5173/market-analysis
      - http://localhost:5173/portfolio-analysis
    settings:
      preset: "desktop"
      chromeFlags: "--no-sandbox --headless"

  assert:
    preset: "lighthouse:no-pwa"
    assertions:
      # Performance budget (relaxed for development; tighten for production)
      categories:performance:
        - warn
        - minScore: 0.60
      categories:accessibility:
        - warn
        - minScore: 0.85
      categories:best-practices:
        - warn
        - minScore: 0.85
      categories:seo:
        - warn
        - minScore: 0.80

      # Key metrics
      first-contentful-paint:
        - warn
        - maxNumericValue: 3000
      largest-contentful-paint:
        - warn
        - maxNumericValue: 5000
      cumulative-layout-shift:
        - warn
        - maxNumericValue: 0.1
      total-blocking-time:
        - warn
        - maxNumericValue: 500
      interactive:
        - warn
        - maxNumericValue: 8000

  upload:
    target: "temporary-public-storage"
