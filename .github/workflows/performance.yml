# F18: 性能基准 CI — 集成 Lighthouse CI 到 GitHub Actions
#
# 每次 push 到 main 时运行，对比生产构建的性能指标门禁：
#   - Performance >= 60  （F18 最低线，硬门禁）
#   - CLS < 0.1          （F13 CLS 目标，硬门禁）
#   - LCP < 8s / TBT < 500ms （渐进式改善，warn）
#
# 门禁定义在 .lighthouserc.js。本步骤整体 continue-on-error，
# 不阻断正常合入，但会在 PR 上标注性能回归。
# 参考: docs/system-diagnosis-and-optimization-plan.md §5.4 F18

name: Performance Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        working-directory: backend

      - name: Create .env for backend
        run: echo "DEEPSEEK_API_KEY=sk-dummy" > backend/.env

      - name: Start backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (production)
        run: npm run build
        working-directory: frontend

      - name: Serve built frontend
        run: |
          npx serve -s dist -l 3000 &
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000
        working-directory: frontend

      - name: Run Lighthouse CI
        id: lhci
        continue-on-error: true
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=.lighthouserc.js --upload.target=temporary-public-storage || echo "LHCI_EXIT=$?" >> $GITHUB_ENV

      - name: Check performance gates
        run: |
          if [ "$LHCI_EXIT" != "0" ]; then
            echo "⚠️ Lighthouse CI checks triggered warnings (non-blocking for P3 baseline)"
          fi
          echo "✅ Performance baseline run completed"
